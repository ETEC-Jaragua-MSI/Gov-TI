name: 🔍 Revisão de Artefato
description: "Solicite revisão de um artefato do TCC pela professora"
title: "[REVISÃO] Nome-do-Projeto — Artefato XX"
labels: ["revisao-solicitada"]
assignees: ["pro-taina-etec"]

body:
  - type: markdown
    attributes:
      value: |
        ## 🔍 Solicitação de Revisão de Artefato
        Use este formulário para pedir feedback sobre um artefato antes da entrega final.

  - type: input
    id: projeto
    attributes:
      label: "Projeto"
      placeholder: "meu-projeto-tcc"
    validations:
      required: true

  - type: dropdown
    id: artefato
    attributes:
      label: "Artefato solicitado para revisão"
      options:
        - "00 — README do Projeto"
        - "01 — Diagnóstico do Cenário Atual"
        - "02 — Questionário Aplicado + Respostas"
        - "03 — Mapeamento do Processo AS-IS"
        - "04 — Mapeamento do Processo TO-BE"
        - "05 — Catálogo de Incidentes Recorrentes"
        - "06 — Base de Conhecimento"
        - "07 — Matriz de Prioridade + SLAs"
        - "08 — Matriz RACI"
        - "09 — Relatório de Simulação/Validação"
        - "10 — Plano de Implementação"
        - "11 — Estrutura da Monografia"
        - "12 — Roteiro dos Slides da Defesa"
    validations:
      required: true

  - type: input
    id: link-artefato
    attributes:
      label: "Link para o arquivo no GitHub"
      description: "Cole o link direto para o arquivo no repositório do projeto"
      placeholder: "https://github.com/ETEC-Jaragua-MSI/meu-projeto/blob/main/docs/01-diagnostico.md"
    validations:
      required: true

  - type: textarea
    id: o-que-revisar
    attributes:
      label: "O que gostaria que fosse revisado?"
      description: "Pontos específicos de dúvida ou que precisam de atenção"
      placeholder: |
        - A justificativa está adequada?
        - Os dados estão bem apresentados?
        - Está seguindo o modelo do exemplo?
    validations:
      required: true

  - type: dropdown
    id: urgencia
    attributes:
      label: "Urgência"
      options:
        - "Normal — pode revisar na próxima aula"
        - "Importante — preciso de feedback essa semana"
        - "Urgente — prazo próximo"
    validations:
      required: true
