# ============================================================
# Workflow: Verificador de Checklist de Entrega
#
# Objetivo: ao abrir ou atualizar um PR direcionado à main,
# ler o checklist do README.md, calcular o percentual de
# itens concluídos e bloquear o merge (via comentário) se
# estiver abaixo de 80%.
#
# Disparo:
#   - Pull Request aberto, atualizado ou sincronizado
#   - Push na main (para atualizar o score no índice)
# ============================================================

name: Verificar Checklist de Entrega

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

jobs:
  checklist:
    name: Calcular score do checklist
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Contar itens do checklist no README.md
      # --------------------------------------------------------
      - name: Contar itens do checklist
        id: checklist
        run: |
          README="README.md"

          if [ ! -f "$README" ]; then
            echo "AVISO: README.md não encontrado."
            echo "concluidos=0" >> "$GITHUB_OUTPUT"
            echo "pendentes=0" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "percentual=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Contar checkboxes marcados: - [x]
          CONCLUIDOS=$(grep -cP '^\s*-\s*\[x\]' "$README" || true)
          CONCLUIDOS=${CONCLUIDOS:-0}
          # Contar checkboxes pendentes: - [ ]
          PENDENTES=$(grep -cP '^\s*-\s*\[ \]' "$README" || true)
          PENDENTES=${PENDENTES:-0}
          TOTAL=$(( CONCLUIDOS + PENDENTES ))

          if [ "$TOTAL" -gt 0 ]; then
            PERCENTUAL=$(( (CONCLUIDOS * 100) / TOTAL ))
          else
            PERCENTUAL=0
          fi

          echo "concluidos=$CONCLUIDOS" >> "$GITHUB_OUTPUT"
          echo "pendentes=$PENDENTES"   >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"           >> "$GITHUB_OUTPUT"
          echo "percentual=$PERCENTUAL" >> "$GITHUB_OUTPUT"

          # Coletar lista de itens pendentes
          LISTA_PENDENTES=$(grep -P '^\s*-\s*\[ \]' "$README" | sed 's/^[[:space:]]*//' | head -20 || true)
          {
            echo "lista_pendentes<<LISTA_EOF"
            echo "$LISTA_PENDENTES"
            echo "LISTA_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Score do checklist: $CONCLUIDOS/$TOTAL ($PERCENTUAL%)"

      # --------------------------------------------------------
      # 3. Comentar no PR com o resultado
      # --------------------------------------------------------
      - name: Comentar no PR
        uses: actions/github-script@v7
        env:
          CONCLUIDOS: ${{ steps.checklist.outputs.concluidos }}
          PENDENTES: ${{ steps.checklist.outputs.pendentes }}
          TOTAL: ${{ steps.checklist.outputs.total }}
          PERCENTUAL: ${{ steps.checklist.outputs.percentual }}
          LISTA_PENDENTES: ${{ steps.checklist.outputs.lista_pendentes }}
        with:
          script: |
            const concluidos = parseInt(process.env.CONCLUIDOS) || 0;
            const pendentes  = parseInt(process.env.PENDENTES)  || 0;
            const total      = parseInt(process.env.TOTAL)      || 0;
            const percentual = parseInt(process.env.PERCENTUAL) || 0;
            const lista      = process.env.LISTA_PENDENTES || '';

            const aprovado = percentual >= 80;
            const emoji    = aprovado ? '✅' : '⚠️';
            const status   = aprovado
              ? '**Checklist aprovado** — score acima de 80%.'
              : '**Checklist incompleto** — score abaixo de 80%. Conclua os itens antes do merge.';

            // Barra de progresso visual (20 blocos)
            const blocos = 20;
            const preenchidos = Math.round((percentual / 100) * blocos);
            const barra = '█'.repeat(preenchidos) + '░'.repeat(blocos - preenchidos);

            let corpo = `## ${emoji} Checklist de Entrega — ${percentual}%\n\n`;
            corpo += `${status}\n\n`;
            corpo += `| Métrica | Valor |\n`;
            corpo += `|---------|-------|\n`;
            corpo += `| ✅ Concluídos | ${concluidos} |\n`;
            corpo += `| ⬜ Pendentes | ${pendentes} |\n`;
            corpo += `| 📋 Total | ${total} |\n`;
            corpo += `| 📊 Score | **${percentual}%** |\n\n`;
            corpo += `\`[${barra}] ${percentual}%\`\n`;

            if (!aprovado && lista) {
              corpo += `\n### Itens ainda pendentes\n\n`;
              lista.split('\n').filter(l => l.trim()).forEach(item => {
                corpo += `${item}\n`;
              });
              corpo += `\n> Complete os itens acima e atualize o README.md antes de solicitar o merge.\n`;
            }

            corpo += `\n---\n*Verificado automaticamente pelo workflow \`checklist-entrega.yml\`*`;

            // Encontrar comentário anterior deste bot para atualizar (evita spam)
            const comentarios = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComentario = comentarios.data.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Checklist de Entrega')
            );

            if (botComentario) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComentario.id,
                body: corpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: corpo,
              });
            }

            // Falhar o job se score < 80% (bloqueia merge via status check)
            if (!aprovado) {
              core.setFailed(`Score do checklist: ${percentual}% (mínimo: 80%). Complete os itens pendentes.`);
            }
